<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your workspace · Jason Teixeira</title>
<link rel="preload" href="assets/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/plus-jakarta-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css?v=20260901b">
<link rel="stylesheet" href="assets/client.css?v=20260908">
<style>
  .cx-admin { border:1px solid color-mix(in oklab,var(--green) 40%,var(--line)); background:color-mix(in oklab,var(--green) 8%,transparent); border-radius:14px; padding:15px 20px; margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="cx-page">
  <header class="cx-top">
    <a class="cx-brand" href="index.html"><span class="cx-logo"><span style="color:#22d3ee">J</span><span style="color:#a78bfa">T</span></span><span class="cx-brandtext">Sage Ideas <span class="s">· client workspace</span></span></a>
    <div class="cx-top-right"><span id="cx-email"></span><button type="button" class="cx-logout" id="cx-logout">Log out</button></div>
  </header>
  <main class="cx-main" id="root"><p class="cx-sub">Loading your workspace…</p></main>
</div>
<script type="module">
  import { getSession, currentUser, signOut } from './assets/auth.mjs';
  import { money } from './assets/proposal-core.mjs';
  const root = document.getElementById('root');
  const s = getSession();
  if (!s || !s.access_token) { location.replace('login.html?next=dashboard.html'); }

  const STATUS = { kickoff: 'Kickoff', active: 'Active', in_progress: 'In progress', delivered: 'Delivered', complete: 'Complete', completed: 'Complete' };
  function el(tag, cls, txt) { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
  const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };

  document.getElementById('cx-logout').addEventListener('click', async () => { try { await signOut(); } catch { /* ignore */ } location.href = 'index.html'; });

  (async () => {
    const u = await currentUser();
    if (!u) { location.replace('login.html?next=dashboard.html'); return; }
    document.getElementById('cx-email').textContent = u.email || '';

    let data = { projects: [], admin: false, email: u.email };
    let loadError = false;
    try {
      const r = await fetch('/api/my-projects', { headers: { Authorization: `Bearer ${s.access_token}` } });
      if (r.ok) data = await r.json();
      else loadError = true;
    } catch { loadError = true; }

    root.innerHTML = '';
    root.appendChild(el('div', 'cx-eyebrow', 'Client workspace'));
    root.appendChild(el('h1', 'cx-h1', 'Your projects'));
    root.appendChild(el('p', 'cx-sub', 'Everything we’re building for you — status, deliverables, messages, and billing in one place.'));

    if (data.admin) {
      const a = el('div', 'cx-admin');
      a.appendChild(el('div', null, 'You’re signed in as the operator.'));
      const link = el('a', 'btn-solid green', 'Open admin cockpit →'); link.href = 'proposal-admin.html'; link.style.cssText = 'padding:8px 16px;font-size:13px;text-decoration:none';
      a.appendChild(link);
      root.appendChild(a);
    }

    if (loadError) {
      const e = el('div', 'cx-empty');
      e.appendChild(el('div', null, 'We couldn’t load your projects right now.'));
      const p2 = el('p', null, 'This is on our end, not yours. Please refresh in a moment.'); p2.style.cssText = 'margin-top:8px;font-size:14px';
      const rb = el('button', 'btn-solid green', 'Retry'); rb.style.cssText = 'margin-top:16px;padding:9px 18px;font-size:13px;cursor:pointer'; rb.addEventListener('click', () => location.reload());
      e.appendChild(p2); e.appendChild(rb); root.appendChild(e); return;
    }

    const projects = Array.isArray(data.projects) ? data.projects : [];
    if (!projects.length) {
      const e = el('div', 'cx-empty');
      e.appendChild(el('div', null, data.admin ? 'No client projects yet — they appear here as clients come aboard.' : 'No projects yet.'));
      const p2 = el('p', null, data.admin ? '' : 'Once you’ve booked a project it shows up here. Questions in the meantime?');
      p2.style.cssText = 'margin-top:8px;font-size:14px';
      if (!data.admin) { const talk = el('a', null, 'Talk to Jason →'); talk.href = 'book.html'; talk.style.color = 'var(--cyan)'; talk.style.textDecoration = 'none'; p2.appendChild(document.createTextNode(' ')); p2.appendChild(talk); }
      e.appendChild(p2); root.appendChild(e); return;
    }

    const grid = el('div', 'cx-grid');
    for (const p of projects) {
      const plan = p.plan || {};
      const card = document.createElement('a');
      card.className = 'cx-card'; card.href = `portal.html?id=${encodeURIComponent(p.portalToken)}`;
      card.appendChild(el('div', 'st', STATUS[String(p.status || 'kickoff').toLowerCase()] || 'Active'));
      card.appendChild(el('div', 'amt', money(plan.firm_cents)));
      let pay;
      if (plan.balance_paid_at) pay = `Paid in full · ${fmtDate(plan.balance_paid_at)}`;
      else if (plan.paid_at) pay = `Deposit paid ${fmtDate(plan.paid_at)} · ${money(plan.balance_cents)} balance due`;
      else pay = 'Awaiting deposit';
      card.appendChild(el('div', 'pay', pay));
      if (p.contract && p.contract.status === 'sent') card.appendChild(el('span', 'flag sign', '✍ Contract awaiting your signature'));
      else if (p.contract && p.contract.status === 'accepted') card.appendChild(el('span', 'flag signed', '✓ Contract signed'));
      card.appendChild(el('div', 'go', 'Open project →'));
      grid.appendChild(card);
    }
    root.appendChild(grid);
  })();
</script>
</body>
</html>
