<style>
  :root { --ink:#F4F2EF; --dim:#A8A29E; --faint:#8E8882; --line:#2A2826; --card:#0C0C0E; --bg:#09090B; --green:#10b981; --cyan:#22d3ee; --purple:#a78bfa; --amber:#F59E0B; --rose:#f43f5e; --mono:'JetBrains Mono',monospace; --serif:'Instrument Serif',Georgia,serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
  a { color:inherit; text-decoration:none; }
  .mono { font-family:var(--mono); }
  .subtle { color:var(--dim); font-size:15px; line-height:1.72; }
  h1.sec-title { font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(2rem,4vw,3rem); letter-spacing:-0.02em; line-height:1.05; margin:26px 0 0; color:#F4F2EF; }
  .admin-wrap { max-width:1080px; margin:0 auto; padding:clamp(32px,6vw,64px) clamp(18px,4vw,40px); }
  .admin-card { border:1px solid var(--line); background:var(--card); border-radius:16px; padding:clamp(18px,3vw,26px); margin-top:20px; }
  .stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-top:22px; }
  .stat { border:1px solid var(--line); background:var(--card); border-radius:14px; padding:16px 18px; }
  .stat .n { font-family:var(--serif); font-size:2rem; color:var(--ink); line-height:1; }
  .stat .l { font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); margin-top:6px; }
  table.admin-table { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.admin-table th { text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); padding:8px 10px; border-bottom:1px solid var(--line); }
  table.admin-table td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; color:var(--ink); }
  .chip { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; padding:4px 10px; border-radius:20px; border:1px solid var(--line); white-space:nowrap; }
  .chip .dot { width:6px; height:6px; border-radius:50%; }
  label.fld { display:block; margin-bottom:14px; }
  label.fld span.lbl-text { display:block; font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
  .admin-card input, .admin-card textarea { width:100%; background:#0F0F13; border:1px solid var(--line); border-radius:9px; padding:11px 13px; font-size:14px; color:var(--ink); font-family:inherit; outline:none; }
  .admin-card input:focus-visible, .admin-card textarea:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .grid2 { grid-template-columns:1fr; } }
  .admin-wrap .btn-solid:focus-visible, .admin-wrap .btn-ghost:focus-visible, .admin-wrap button:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce) {
    .btn-solid.green:hover, .btn-solid.cyan:hover { transform:none; }
  }

  /* ── App shell (institutional cockpit) ─────────────────────────── */
  .ax-shell { display:grid; grid-template-columns:248px 1fr; min-height:100vh; min-height:100dvh; }
  .ax-side { position:sticky; top:0; height:100vh; height:100dvh; border-right:1px solid var(--line); background:#0A0A0C; display:flex; flex-direction:column; padding:16px 12px; }
  .ax-brand { display:flex; align-items:center; gap:10px; padding:6px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .ax-logo { width:28px; height:28px; border:1px solid var(--line); border-radius:7px; display:inline-flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:700; background:var(--card); }
  .ax-brandtext { font-family:var(--mono); font-size:13px; font-weight:600; }
  .ax-nav { display:flex; flex-direction:column; gap:2px; flex:1; }
  .ax-navitem { display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px; font-size:14px; color:var(--dim); cursor:pointer; border:none; background:none; font-family:inherit; text-align:left; width:100%; transition:background .12s ease, color .12s ease; }
  .ax-navitem:hover { background:#131317; color:var(--ink); }
  .ax-navitem.on { background:color-mix(in oklab,var(--green) 15%,transparent); color:var(--ink); }
  .ax-navitem .ax-ico { width:18px; flex:none; color:var(--faint); font-family:var(--mono); font-size:13px; text-align:center; }
  .ax-navitem.on .ax-ico { color:var(--green); }
  .ax-side-foot { border-top:1px solid var(--line); padding-top:12px; margin-top:8px; font-family:var(--mono); font-size:11px; color:var(--faint); }
  .ax-main { display:flex; flex-direction:column; min-width:0; }
  .ax-top { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px clamp(20px,3vw,36px); border-bottom:1px solid var(--line); background:rgba(9,9,11,0.86); backdrop-filter:blur(12px); }
  .ax-top-title { font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .ax-top-right { display:flex; align-items:center; gap:14px; font-family:var(--mono); font-size:12px; color:var(--faint); }
  .ax-logout { background:none; border:1px solid var(--line); border-radius:8px; color:var(--dim); font-family:var(--mono); font-size:11px; padding:6px 12px; cursor:pointer; }
  .ax-logout:hover { color:var(--ink); border-color:var(--dim); }
  .ax-content { flex:1; padding:clamp(20px,3vw,40px); width:100%; max-width:1440px; }
  .ax-content button:focus-visible, .ax-content a:focus-visible, .ax-content input:focus-visible, .ax-content select:focus-visible, .ax-content textarea:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  /* dense overview grid */
  .ax-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
  .ax-panel { border:1px solid var(--line); background:var(--card); border-radius:14px; padding:18px 20px; }
  .ax-panel h3 { margin:0 0 12px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:400; }
  @media (max-width:820px) {
    .ax-shell { grid-template-columns:1fr; }
    .ax-side { position:static; height:auto; flex-direction:row; align-items:center; gap:6px; overflow-x:auto; padding:10px 12px; }
    .ax-brand { border-bottom:none; margin:0 8px 0 0; padding:0; white-space:nowrap; }
    .ax-brandtext { display:none; }
    .ax-nav { flex-direction:row; gap:4px; }
    .ax-navitem { white-space:nowrap; padding:8px 12px; }
    .ax-navitem .ax-ico { display:none; }
    .ax-side-foot { display:none; }
    .ax-grid { grid-template-columns:1fr; }
  }
</style>
