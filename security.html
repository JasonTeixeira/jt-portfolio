<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2309090B'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='monospace' font-size='26' font-weight='700' fill='%2310b981'%3EJT%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
<title>Security · Two-factor authentication</title>
<link rel="preload" href="assets/fonts/plus-jakarta-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css?v=20260917f">
<link rel="stylesheet" href="assets/auth.css?v=20260907b">
<style>
  .sec-wrap { max-width:520px; margin:0 auto; padding:40px 20px 100px; }
  .sec-card { border:1px solid var(--a-line,#2A2826); background:var(--a-card,#0C0C0E); border-radius:16px; padding:28px; margin-top:18px; }
  .sec-card h2 { margin:0 0 8px; font-size:1.15rem; }
  .sec-card p { color:var(--a-dim,#A8A29E); font-size:14px; line-height:1.6; margin:0 0 14px; }
  .qr { background:#fff; padding:14px; border-radius:12px; display:inline-block; margin:8px 0 }
  .qr img, .qr svg { display:block; width:180px; height:180px }
  .secret { font-family:var(--mono,monospace); font-size:13px; background:#0F0F13; border:1px solid var(--a-line,#2A2826); border-radius:8px; padding:10px 12px; word-break:break-all; color:var(--a-ink,#F4F2EF) }
  .pill { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-family:var(--mono,monospace); padding:5px 11px; border-radius:999px; border:1px solid }
  .pill.on { color:#10b981; border-color:#10b98144 } .pill.off { color:#F59E0B; border-color:#F59E0B44 }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px }
  input.code { font-family:var(--mono,monospace); letter-spacing:.3em; text-align:center; font-size:18px }
  .muted { color:var(--a-faint,#8E8882); font-size:12px }
  .danger { color:#f43f5e; background:none; border:1px solid #f43f5e44; border-radius:9px; padding:9px 16px; font:inherit; font-size:13px; cursor:pointer }
</style>
</head>
<body>
<main class="auth-shell">
  <div class="auth-bar top">
    <a href="proposal-admin.html" style="color:inherit;text-decoration:none">&larr; Operator console</a>
    <span class="stat">Security</span>
  </div>
  <div class="sec-wrap">
    <h1 class="auth-h" style="font-size:1.6rem">Two-factor authentication</h1>
    <p class="auth-lede">Add a second step to sign-in with an authenticator app (Google Authenticator, 1Password, Authy). Strongly recommended for operator accounts — the console holds client data and billing.</p>
    <div id="root" class="sec-card"><p class="muted">Loading…</p></div>
  </div>
  <div class="auth-bar bot"><span>Encrypted session</span><span class="lit">Jason Teixeira · Sage Ideas</span></div>
</main>
<script type="module">
  import { getSession, currentUser, clearSession, listFactors, enrollTotp, challengeFactor, verifyFactor, unenrollFactor } from './assets/auth.mjs';
  const root = document.getElementById('root');
  const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); for (const k in (attrs||{})) { if (k === 'class') n.className = attrs[k]; else if (k === 'html') n.innerHTML = attrs[k]; else n.setAttribute(k, attrs[k]); } for (const c of kids) n.append(c); return n; };
  const clear = () => { while (root.firstChild) root.removeChild(root.firstChild); };

  function token() { const s = getSession(); return s && s.access_token; }

  async function boot() {
    const u = await currentUser().catch(() => null);
    if (!u) { location.replace('login.html?next=security.html'); return; }
    const fac = await listFactors(token());
    fac.verified ? renderOn(fac) : renderOff();
  }

  function renderOff() {
    clear();
    root.append(
      el('h2', {}, 'Two-factor is ', el('span', { class: 'pill off' }, 'OFF')),
      el('p', {}, 'Turn it on to require a one-time code from your authenticator app every time you sign in.'),
    );
    const btn = el('button', { class: 'btn-solid green', style: 'padding:11px 20px;cursor:pointer' }, 'Enable two-factor');
    btn.addEventListener('click', startEnroll);
    root.append(btn);
  }

  async function startEnroll() {
    clear(); root.append(el('p', { class: 'muted' }, 'Setting up…'));
    const r = await enrollTotp(token(), 'Operator authenticator');
    if (!r.ok || !r.data || !r.data.id) { renderError('Could not start setup. Refresh and try again.'); return; }
    const factorId = r.data.id;
    const totp = r.data.totp || {};
    const qrRaw = totp.qr_code || '';
    const src = qrRaw.startsWith('data:') ? qrRaw : ('data:image/svg+xml;utf8,' + encodeURIComponent(qrRaw));
    clear();
    root.append(
      el('h2', {}, 'Scan this with your authenticator'),
      el('p', {}, 'Open your authenticator app and scan the QR code, or enter the setup key manually.'),
      el('div', { class: 'qr' }, el('img', { src, alt: 'TOTP QR code' })),
      el('p', { class: 'muted', style: 'margin:6px 0 4px' }, 'Setup key'),
      el('div', { class: 'secret' }, totp.secret || ''),
    );
    const code = el('input', { class: 'auth-cell code', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '123456' });
    const verify = el('button', { class: 'btn-solid green', style: 'padding:11px 20px;cursor:pointer' }, 'Verify & enable');
    const status = el('span', { class: 'muted' }, '');
    verify.addEventListener('click', async () => {
      status.textContent = 'Verifying…';
      const ch = await challengeFactor(token(), factorId);
      if (!ch.ok || !ch.data || !ch.data.id) { status.textContent = 'Could not verify — try again.'; return; }
      const v = await verifyFactor(token(), factorId, ch.data.id, code.value);
      if (v.ok) { const fac = await listFactors(token()); renderOn(fac); }
      else { status.textContent = 'That code isn’t right — try again.'; code.value = ''; code.focus(); }
    });
    root.append(el('div', { class: 'row' }, code, verify), el('div', { style: 'margin-top:8px' }, status));
    code.focus();
  }

  function renderOn(fac) {
    clear();
    root.append(
      el('h2', {}, 'Two-factor is ', el('span', { class: 'pill on' }, 'ON')),
      el('p', {}, 'Sign-in now requires a code from your authenticator. Keep a backup of your setup key somewhere safe — if you lose your device, use the break-glass admin key to regain access.'),
    );
    const off = el('button', { class: 'danger' }, 'Turn off two-factor');
    off.addEventListener('click', () => renderDisable(fac));
    root.append(off);
  }

  // Disabling MFA requires proving possession of the authenticator RIGHT NOW (a fresh
  // challenge+verify), so a stolen session token alone can't strip MFA off the account.
  function renderDisable(fac) {
    clear();
    root.append(
      el('h2', {}, 'Confirm it’s you'),
      el('p', {}, 'Enter a current code from your authenticator to turn two-factor off.'),
    );
    const f = (fac.factors || [])[0];
    const code = el('input', { class: 'auth-cell code', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '123456' });
    const confirm = el('button', { class: 'danger' }, 'Verify & turn off');
    const cancel = el('button', { class: 'btn-ghost', style: 'padding:9px 16px;cursor:pointer' }, 'Keep it on');
    const status = el('span', { class: 'muted' }, '');
    cancel.addEventListener('click', () => renderOn(fac));
    confirm.addEventListener('click', async () => {
      if (!f) { renderOff(); return; }
      status.textContent = 'Verifying…';
      const ch = await challengeFactor(token(), f.id);
      if (!ch.ok || !ch.data || !ch.data.id) { status.textContent = 'Could not verify — try again.'; return; }
      const v = await verifyFactor(token(), f.id, ch.data.id, code.value);
      if (!v.ok) { status.textContent = 'That code isn’t right — try again.'; code.value = ''; code.focus(); return; }
      // Only after a live code checks out do we strip the factor.
      await unenrollFactor(token(), f.id);
      const re = await listFactors(token());
      re.verified ? renderOn(re) : renderOff();
    });
    root.append(el('div', { class: 'row' }, code, confirm, cancel), el('div', { style: 'margin-top:8px' }, status));
    code.focus();
  }

  function renderError(m) { clear(); root.append(el('p', { style: 'color:#F59E0B' }, m)); }
  boot().catch(() => renderError('Something went wrong. Refresh to retry.'));
</script>
</body>
</html>
