<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Create your account · Jason Teixeira</title>
<link rel="preload" href="assets/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/plus-jakarta-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css?v=20260901b">
<link rel="stylesheet" href="assets/auth.css?v=20260907">
</head>
<body>
<main class="auth-shell">
  <section class="auth-panel">
    <a class="auth-brand" href="index.html">&larr; <b>jason.teixeira</b><span class="p">()</span></a>
    <div class="auth-inner">
      <div class="auth-eyebrow"><span class="dot"></span> create account</div>
      <h1>Start your portal</h1>
      <p class="sub">One place to track your project, review deliverables, message me, and handle billing.</p>
      <form id="f" novalidate>
        <label class="auth-field"><span>Email</span><input type="email" id="email" autocomplete="email" placeholder="you@company.com" required></label>
        <label class="auth-field"><span>Password</span><input type="password" id="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label>
        <p class="auth-hint">Use at least 8 characters.</p>
        <button type="submit" class="btn-solid green auth-btn" id="btn">Create account</button>
        <div class="auth-msg" id="msg" role="status" aria-live="polite"></div>
      </form>
      <div class="auth-links center"><a href="login.html">Already have an account? Log in</a></div>
    </div>
  </section>
  <aside class="auth-stage" aria-hidden="true">
    <canvas id="viz"></canvas>
    <div class="auth-caption">
      <div class="term" id="term"></div>
      <div class="tag">Built, then <em>tested</em> — before it reaches you.</div>
    </div>
  </aside>
</main>
<script type="module">
  import { signUp, getSession } from './assets/auth.mjs';
  import { mountAuthVisual, mountAuthTerminal } from './assets/auth-visual.mjs';
  mountAuthVisual(document.getElementById('viz'));
  mountAuthTerminal(document.getElementById('term'), ['> creating workspace', '> provisioning portal', '> everything here is tested']);
  if (getSession()) location.replace('dashboard.html');
  const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'auth-msg'; msg.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (password.length < 8) { msg.className = 'auth-msg err'; msg.textContent = 'Use at least 8 characters.'; return; }
    btn.disabled = true; btn.textContent = 'Creating…';
    const r = await signUp(email, password, `${location.origin}/login.html`);
    if (r.ok && r.data.access_token) { location.replace('dashboard.html'); return; }
    if (r.ok) { msg.className = 'auth-msg ok'; msg.textContent = 'Check your email to confirm your account, then log in.'; btn.textContent = 'Account created'; return; }
    btn.disabled = false; btn.textContent = 'Create account';
    msg.className = 'auth-msg err';
    msg.textContent = /registered|exists/i.test(JSON.stringify(r.data)) ? 'That email already has an account — try logging in.' : (r.data.msg || r.data.error_description || 'Couldn’t create your account. Try again.');
  });
</script>
</body>
</html>
