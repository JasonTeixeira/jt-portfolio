<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reset password · Jason Teixeira</title>
<link rel="preload" href="assets/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/plus-jakarta-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css?v=20260901b">
<link rel="stylesheet" href="assets/auth.css?v=20260907">
</head>
<body>
<main class="auth-shell">
  <section class="auth-panel">
    <a class="auth-brand" href="index.html">&larr; <b>jason.teixeira</b><span class="p">()</span></a>
    <div class="auth-inner" id="card"></div>
  </section>
  <aside class="auth-stage" aria-hidden="true">
    <canvas id="viz"></canvas>
    <div class="auth-caption">
      <div class="term" id="term"></div>
      <div class="tag">Back in, in <em>a moment</em>.</div>
    </div>
  </aside>
</main>
<script type="module">
  import { requestReset, updatePassword } from './assets/auth.mjs';
  import { mountAuthVisual, mountAuthTerminal } from './assets/auth-visual.mjs';
  mountAuthVisual(document.getElementById('viz'));
  mountAuthTerminal(document.getElementById('term'), ['> secure recovery channel', '> verifying request', '> everything here is tested']);
  const card = document.getElementById('card');
  // Supabase sends the recovery link back with tokens in the URL hash.
  const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const recoveryToken = hash.get('type') === 'recovery' ? hash.get('access_token') : null;
  // STATIC HTML ONLY — never interpolate user/URL-derived data into these template
  // strings (recoveryToken, Supabase error text, query params). This is an innerHTML sink.
  function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

  if (recoveryToken) {
    card.appendChild(el(`
      <div>
        <div class="auth-eyebrow"><span class="dot"></span> choose a new password</div>
        <h1>Set a new password</h1>
        <p class="sub">Enter a new password for your account.</p>
        <form id="f" novalidate>
          <label class="auth-field"><span>New password</span><input type="password" id="pw" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label>
          <button type="submit" class="btn-solid green auth-btn" id="btn">Update password</button>
          <div class="auth-msg" id="msg" role="status" aria-live="polite"></div>
        </form>
      </div>`));
    const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      if (pw.length < 8) { msg.className = 'auth-msg err'; msg.textContent = 'Use at least 8 characters.'; return; }
      btn.disabled = true; btn.textContent = 'Updating…';
      const r = await updatePassword(recoveryToken, pw);
      if (r.ok) { msg.className = 'auth-msg ok'; msg.textContent = 'Password updated. Redirecting to log in…'; setTimeout(() => location.replace('login.html'), 1400); return; }
      btn.disabled = false; btn.textContent = 'Update password';
      msg.className = 'auth-msg err'; msg.textContent = r.data.msg || 'That reset link has expired. Request a new one.';
    });
  } else {
    card.appendChild(el(`
      <div>
        <div class="auth-eyebrow"><span class="dot"></span> password reset</div>
        <h1>Reset your password</h1>
        <p class="sub">Enter your email and we’ll send a secure reset link.</p>
        <form id="f" novalidate>
          <label class="auth-field"><span>Email</span><input type="email" id="email" autocomplete="email" placeholder="you@company.com" required></label>
          <button type="submit" class="btn-solid green auth-btn" id="btn">Send reset link</button>
          <div class="auth-msg" id="msg" role="status" aria-live="polite"></div>
        </form>
        <div class="auth-links center"><a href="login.html">Back to log in</a></div>
      </div>`));
    const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'Sending…';
      await requestReset(document.getElementById('email').value.trim(), `${location.origin}/reset.html`);
      // Always show success (don't reveal whether an email exists).
      msg.className = 'auth-msg ok';
      msg.textContent = 'If that email has an account, a reset link is on its way.';
      btn.textContent = 'Sent';
    });
  }
</script>
</body>
</html>
