const sd=document.getElementById('scenes');
sd.innerHTML=`

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const secEls=$$('.scene');
function cl(x,a,b){return Math.max(a,Math.min(b,x));}
function rise(el,lt,at,dur=0.6,dy=26){if(!el)return;let p=cl((lt-at)/dur,0,1);const e=1-Math.pow(1-p,3);el.style.opacity=e;el.style.transform=`translateY(${(1-e)*dy}px)`;}
function fade(el,lt,at,dur=0.5){if(!el)return;let p=cl((lt-at)/dur,0,1);el.style.opacity=1-Math.pow(1-p,3);}
function pop(el,lt,at,dur=0.55){if(!el)return;let p=cl((lt-at)/dur,0,1);const e=1-Math.pow(1-p,3);el.style.opacity=e;el.style.transform=`scale(${0.92+0.08*e})`;}
function popn(el,lt,at,dur=0.5){if(!el)return;let p=cl((lt-at)/dur,0,1);const e=1-Math.pow(1-p,3);el.style.opacity=e;el.style.transform=`translateY(${(1-e)*30}px) scale(${0.9+0.1*e})`;}
const words=id=>$$('#'+id+' .w');
function seq(els,lt,at,step=0.13,dur=0.5){els.forEach((el,i)=>rise(el,lt,at+i*step,dur));}
function num(el,lt,at,dur,to,suf){if(!el)return;let p=cl((lt-at)/dur,0,1);const e=1-Math.pow(1-p,3);el.textContent=(Math.round(e*to)).toLocaleString()+(suf||'');}
const HK=SC[0][2]; // hook duration
function render(t){
  const cur=SC.find(s=>t>=s[1]&&t<s[2])||SC[SC.length-1];
  const lt=t-cur[1],dur=cur[2]-cur[1];
  secEls.forEach(el=>{const on=el.dataset.s===cur[0];el.classList.toggle('on',on);
    if(on){const ent=Math.min(1,lt/0.5),e=1-Math.pow(1-ent,3);el.style.opacity=e;el.style.transform=`translateY(${((1-e)*40).toFixed(1)}px) scale(${(1+0.012*(lt/dur)).toFixed(4)})`;}
    else{el.style.opacity='';el.style.transform='';}});
  let rbl=0,grn=0;
  if(cur[0]==='hook'){
    pop($('#panel'),lt,0.2);fade($('#hsub'),lt,0.8);
    const nL=cfg.hook.lines.length;
    for(let i=0;i<nL;i++)fade($('#l'+i),lt,0.6+i*(HK*0.13));
    const gAt=HK*0.42, gw=(lt>=gAt-0.1&&lt<=gAt+1.1)?cl(1-Math.abs(lt-(gAt+0.4))/0.7,0,1):0;
    $('#slice').style.opacity=(gw*(0.55+0.45*Math.sin(lt*70))).toFixed(2);
    $('#panel').style.transform=`translateX(${(gw*Math.sin(lt*85)*6).toFixed(1)}px)`;rbl=gw*0.7;
    const co=HK*0.60;const wo=cl(1-(lt-co)/0.5,0,1);$('#hwrap').style.opacity=wo.toFixed(3);
    fade($('#hhead'),lt,co+0.15,0.4);seq(words('hh'),lt,co+0.3);fade($('#hhsub'),lt,HK*0.85);
  }
  else if(cur[0]==='build'){fade($('#ey2'),lt,0.05);seq(words('h2'),lt,0.4);
    const P=cfg.build.pipe.length;for(let i=0;i<P;i++){rise($('#pn'+i),lt,1.2+i*0.4,.5,18);if(i)fade($('#pa'+i),lt,1.35+i*0.4,.3);}
    fade($('#sub2'),lt,1.2+P*0.4+0.3);}
  else if(cur[0]==='hard'){fade($('#ey3'),lt,0.05);seq(words('h3'),lt,0.4);
    cfg.hard.chips.forEach((c,i)=>rise($('#g'+i),lt,1.4+i*0.32,.5,18));
    const bAt=Math.min(dur-1.6,1.4+cfg.hard.chips.length*0.32+0.6);
    const bw=(lt>=bAt+0.4&&lt<=bAt+2.2)?cl(1-Math.abs(lt-(bAt+1.2))/0.9,0,1):0;rbl=bw*0.35;
    fade($('#blk'),lt,bAt,0.4);}
  else if(cur[0]==='proof'){grn=Math.max(0,1-Math.abs(lt-0.6)/0.7);pop($('#stamp'),lt,0.3);
    cfg.proof.metrics.forEach((m,i)=>{popn($('#bn'+i),lt,0.9+i*0.2);num($('#bv'+i),lt,0.9+i*0.2,1.5,m[0],m[1]);});
    fade($('#mtag'),lt,2.7);}
  else if(cur[0]==='cta'){fade($('#b5'),lt,0.1);seq(words('h5'),lt,0.4);pop($('#ctab'),lt,1.3);fade($('#ctau'),lt,1.8);}
  $('#rbloom').style.opacity=rbl.toFixed(3);$('#bloom').style.opacity=grn.toFixed(3);
  const prog=cl(t/TOTAL,0,1)*100;
  const b=SC[1][1],hd=SC[2][1],pr=SC[3][1];
  const col=t<hd?'#22d3ee':t<pr?'#F59E0B':'#10b981';
  const lab=t<b?cfg.pLabels[0]:t<hd?cfg.pLabels[1]:t<pr?cfg.pLabels[2]:cfg.pLabels[3];
  const pf=$('#pfill'),pd=$('#pdot'),pl=$('#plabel');
  pf.style.width=prog+'%';pf.style.background=col;pf.style.color=col;
  pd.style.left=prog+'%';pd.style.background=col;pd.style.color=col;
  pl.style.left=prog+'%';pl.style.color=col;if(pl.textContent!==lab)pl.textContent=lab;
}
window.__seek=(t)=>{try{au.currentTime=t;}catch(e){}render(t);};
