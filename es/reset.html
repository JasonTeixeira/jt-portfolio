</head>
<body>
<main class="auth-shell">
  <div class="auth-bar top">
    <a href="/es/index.html" style="color:inherit;text-decoration:none">&larr; JASON.TEIXEIRA<span style="color:var(--a-acc)">()</span></a>
    <span class="stat">Seguro</span>
  </div>

  <div class="auth-main">
    <aside class="auth-rail">
      <div class="auth-index">03 / Recuperación</div>
      <div class="auth-slug">De vuelta en <em>un momento</em>.</div>
      <div class="auth-meta"><b>Sage Ideas LLC</b><br>Chicago · Est. 2024<br>agency.sageideas.dev</div>
    </aside>

    <section class="auth-formcol">
      <div class="inner" id="card"></div>
    </section>
  </div>

  <div class="auth-bar bot">
    <span>Sesión cifrada</span>
    <span class="lit">Nexural &middot; Sage Ideas</span>
  </div>
</main>
<script type="module">
  import { sendAuthEmail, updatePassword } from '/assets/auth.mjs';
  const card = document.getElementById('card');
  const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const recoveryToken = hash.get('type') === 'recovery' ? hash.get('access_token') : null;
  // STATIC HTML ONLY — never interpolate user/URL-derived data into these template
  // strings (recoveryToken, Supabase error text, query params). This is an innerHTML sink.
  function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

  if (recoveryToken) {
    card.appendChild(el(`
      <div>
        <h1 class="auth-h">Define una nueva contraseña</h1>
        <p class="auth-lede">Elige una nueva contraseña para tu cuenta.</p>
        <form id="f" novalidate>
          <label class="auth-field"><span>Nueva contraseña <span class="idx">01</span></span><input class="auth-cell" type="password" id="pw" autocomplete="new-password" minlength="8" placeholder="Al menos 8 caracteres" required></label>
          <button type="submit" class="auth-submit" id="btn"><span id="lbl">Actualizar contraseña</span><span class="arw">&rarr;</span></button>
          <div class="auth-msg" id="msg" role="status" aria-live="polite"></div>
        </form>
      </div>`));
    const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn'), lbl = document.getElementById('lbl');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      if (pw.length < 8) { msg.className = 'auth-msg err'; msg.textContent = '// usa al menos 8 caracteres.'; return; }
      btn.disabled = true; lbl.textContent = 'Actualizando…';
      const r = await updatePassword(recoveryToken, pw);
      if (r.ok) { msg.className = 'auth-msg ok'; msg.textContent = '// contraseña actualizada. redirigiendo al inicio de sesión…'; setTimeout(() => location.replace('login.html'), 1400); return; }
      btn.disabled = false; lbl.textContent = 'Actualizar contraseña';
      msg.className = 'auth-msg err'; msg.textContent = '// ' + (r.data.msg || 'ese enlace de restablecimiento expiró. solicita uno nuevo.');
    });
  } else {
    card.appendChild(el(`
      <div>
        <h1 class="auth-h">Restablecer contraseña</h1>
        <p class="auth-lede">Escribe tu correo y te enviaremos un enlace seguro de restablecimiento.</p>
        <form id="f" novalidate>
          <label class="auth-field"><span>Correo <span class="idx">01</span></span><input class="auth-cell" type="email" id="email" autocomplete="email" placeholder="tú@empresa.com" required></label>
          <button type="submit" class="auth-submit" id="btn"><span id="lbl">Enviar enlace</span><span class="arw">&rarr;</span></button>
          <div class="auth-msg" id="msg" role="status" aria-live="polite"></div>
        </form>
        <div class="auth-foot"><a href="/es/login.html">Volver a <span class="mk">iniciar sesión</span></a></div>
      </div>`));
    const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn'), lbl = document.getElementById('lbl');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; lbl.textContent = 'Enviando…';
      await sendAuthEmail(document.getElementById('email').value.trim(), 'recovery');
      msg.className = 'auth-msg ok';
      msg.textContent = '// si ese correo tiene una cuenta, el enlace de restablecimiento va en camino.';
      lbl.textContent = 'Enviado';
    });
  }
</script>
<script defer src="/assets/ga.js?v=1"></script>
</body>
</html>
