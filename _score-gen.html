<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"></head><body>
<script>
// Parametric service-video score. ?svc=rag|workflow|websites|content|proof
const T={rag:[0,9.924,20.873,31.218,41.146,46.236],workflow:[0,10.249,20.733,34.794,43.142,47.536],websites:[0,6.58,14.371,24.206,32.415,36.483],content:[0,8.716,18.922,28.757,36.501,40.942],proof:[0,6.998,16.508,28.664,37.43,41.453],howwework:[0,8.484,17.529,28.942,35.712,40.291],casestudy:[0,10.342,19.34,32.286,41.424,45.075],demoslie:[0,11.038,24.031,37.255,43.467,48],llmjudge:[0,8.484,18.179,28.943,36.409,41.174],evalsvstests:[0,7.648,22.359,33.076,41.842,45.911],rageval:[0,9.599,19.619,31.032,36.223,39.781],promptreg:[0,7.973,17.529,27.085,33.761,37.226],hallucinations:[0,9.738,19.154,30.707,35.387,38.341],ciforai:[0,9.506,20.223,28.385,34.504,37.319],onemetric:[0,8.902,18.736,30.661,34.969,37.273],haveqa:[0,6.812,19.572,30.846,35.526,38.805],eyeball:[0,8.949,18.783,27.039,32.647,35.787],fastcost:[0,7.091,17.483,26.574,30.65,34.115],datasafe:[0,7.927,19.247,28.524,32.368,34.904]};
const svc=new URLSearchParams(location.search).get('svc')||'rag';
const sc=T[svc], TOTAL=sc[5], HK=sc[1], BUILD=sc[1], HARD=sc[2], PROOF=sc[3], CTA=sc[4];
const SR=44100, DUR=TOTAL+0.1;
const ac=new OfflineAudioContext(2, Math.ceil(SR*DUR), SR);
const master=ac.createGain(); master.gain.value=0.9;
const comp=ac.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3; comp.attack.value=0.006; comp.release.value=0.18;
master.connect(comp); comp.connect(ac.destination);
const music=ac.createGain(); music.gain.value=0.30; music.connect(master);
const voStarts=[0,BUILD,HARD,PROOF,CTA];
for(const t of voStarts){const g=music.gain; g.setValueAtTime(0.30,Math.max(0,t-0.02)); g.linearRampToValueAtTime(0.16,t+0.05); g.linearRampToValueAtTime(0.30,t+0.55);}
const noise=(()=>{const b=ac.createBuffer(1,SR,SR),d=b.getChannelData(0);for(let i=0;i<SR;i++)d[i]=Math.random()*2-1;return b;})();
function env(g,t,a,pk,h,r){g.setValueAtTime(0.0001,t);g.exponentialRampToValueAtTime(pk,t+a);g.setValueAtTime(pk,t+a+h);g.exponentialRampToValueAtTime(0.0001,t+a+h+r);}
function synth(t,freq,{type='sawtooth',pk=0.2,a=0.006,h=0.06,r=0.2,cut=1800,q=6,dest=music,detune=0}={}){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type=type;o.frequency.value=freq;o.detune.value=detune;f.type='lowpass';f.frequency.value=cut;f.Q.value=q;o.connect(f);f.connect(g);g.connect(dest);env(g.gain,t,a,pk,h,r);o.start(t);o.stop(t+a+h+r+0.05);}
function kick(t,pk=0.9){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);g.gain.setValueAtTime(pk,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.32);}
function hat(t,pk=0.12){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=7000;s.connect(f);f.connect(g);g.connect(music);g.gain.setValueAtTime(pk,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);s.start(t);s.stop(t+0.07);}
function sub(t,freq,dur,pk=0.32){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(music);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+0.05);g.gain.setValueAtTime(pk,t+dur-0.2);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.05);}
function whoosh(t,{pk=0.15,dur=0.6,from=300,to=2800,dest=music}={}){const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;s.loop=true;bp.type='bandpass';bp.Q.value=0.7;s.connect(bp);bp.connect(g);g.connect(dest);bp.frequency.setValueAtTime(from,t);bp.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+dur*0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.start(t);s.stop(t+dur+0.05);}
function chord(t,freqs,{pk=0.14,r=0.7,type='sawtooth',cut=2600}={}){freqs.forEach((f,i)=>synth(t,f,{type,pk:pk/freqs.length+0.03,a:0.012,h:0.28,r,cut,q:2,detune:i*4}));}
function thunk(t){const s=ac.createBufferSource(),hp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;hp.type='highpass';hp.frequency.value=1500;s.connect(hp);hp.connect(g);g.connect(master);g.gain.setValueAtTime(0.26,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);s.start(t);s.stop(t+0.2);kick(t,0.85);chord(t+0.02,[329.63,415.30,493.88,659.25],{pk:0.24,r:0.9,cut:3400});}
function glitch(t){const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;bp.type='bandpass';bp.frequency.value=1400;bp.Q.value=5;s.connect(bp);bp.connect(g);g.connect(master);g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);s.start(t);s.stop(t+0.27);synth(t,98,{type:'square',pk:0.16,a:0.002,h:0.05,r:0.22,cut:800});}
const B=0.5;
for(let t=0.5;t<TOTAL-1.0;t+=B){kick(t,t<HK*0.4?0.55:0.85);hat(t+B/2,0.10);if(t>BUILD&&t<CTA)hat(t+B/4,0.05);}
const roots=[55,61.74,49,55,65.41];
for(let i=0;i<5;i++){const t=sc[i],nx=sc[i+1];sub(t,roots[i],nx-t);}
function arp(t0,t1,notes){let i=0;for(let t=t0;t<t1;t+=B/2){synth(t,notes[i%notes.length],{type:'triangle',pk:0.10,a:0.004,h:0.02,r:0.14,cut:3400,q:3});i++;}}
arp(BUILD,HARD-0.1,[659.25,783.99,987.77,783.99]);
arp(HARD,PROOF-0.1,[587.33,698.46,880,698.46]);
chord(0.5,[220,277.18,329.63],{pk:0.09,r:2.4,cut:1400});
glitch(HK*0.42+0.4);
[BUILD,HARD].forEach(t=>whoosh(t,{pk:0.14}));
whoosh(PROOF,{pk:0.22,dur:0.9,to:3600,dest:master});
whoosh(CTA,{pk:0.2,dur:0.8,to:3400,dest:master});
glitch(PROOF-1.4);
thunk(PROOF);
chord(CTA+0.2,[261.63,329.63,392.00,523.25],{pk:0.16,r:1.6,cut:3200});
if(CTA+2.6<TOTAL)chord(CTA+2.6,[261.63,392.00,523.25,659.25],{pk:0.14,r:2.4,cut:3000});
ac.startRendering().then(buf=>{
  const n=buf.length,ch=2,bytes=n*ch*2,view=new DataView(new ArrayBuffer(44+bytes));
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');view.setUint32(4,36+bytes,true);ws(8,'WAVE');ws(12,'fmt ');view.setUint32(16,16,true);
  view.setUint16(20,1,true);view.setUint16(22,ch,true);view.setUint32(24,SR,true);view.setUint32(28,SR*ch*2,true);
  view.setUint16(32,ch*2,true);view.setUint16(34,16,true);ws(36,'data');view.setUint32(40,bytes,true);
  const L=buf.getChannelData(0),R=buf.getChannelData(1);let o=44;
  for(let i=0;i<n;i++){for(const c of [L,R]){let v=Math.max(-1,Math.min(1,c[i]));view.setInt16(o,v<0?v*0x8000:v*0x7fff,true);o+=2;}}
  let bin='';const u8=new Uint8Array(view.buffer);for(let i=0;i<u8.length;i++)bin+=String.fromCharCode(u8[i]);
  window.__wav=btoa(bin);window.__done=true;
});
