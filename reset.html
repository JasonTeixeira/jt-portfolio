<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2309090B'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='monospace' font-size='26' font-weight='700' fill='%2310b981'%3EJT%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<title>Reset password · Jason Teixeira</title>
<link rel="preload" href="assets/fonts/plus-jakarta-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css?v=20260909a">
<link rel="stylesheet" href="assets/auth.css?v=20260907b">
</head>
<body>
<main class="auth-shell">
  <div class="auth-bar top">
    <a href="index.html" style="color:inherit;text-decoration:none">&larr; JASON.TEIXEIRA<span style="color:var(--a-acc)">()</span></a>
    <span class="stat">Secure</span>
  </div>

  <div class="auth-main">
    <aside class="auth-rail">
      <div class="auth-index">03 / Recovery</div>
      <div class="auth-slug">Back in, in <em>a moment</em>.</div>
      <div class="auth-meta"><b>Sage Ideas LLC</b><br>Chicago · Est. 2024<br>agency.sageideas.dev</div>
    </aside>

    <section class="auth-formcol">
      <div class="inner" id="card"></div>
    </section>
  </div>

  <div class="auth-bar bot">
    <span>Encrypted session</span>
    <span class="lit">Nexural &middot; Sage Ideas</span>
  </div>
</main>
<script type="module">
  import { sendAuthEmail, updatePassword } from './assets/auth.mjs';
  const card = document.getElementById('card');
  const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const recoveryToken = hash.get('type') === 'recovery' ? hash.get('access_token') : null;
  // STATIC HTML ONLY — never interpolate user/URL-derived data into these template
  // strings (recoveryToken, Supabase error text, query params). This is an innerHTML sink.
  function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

  if (recoveryToken) {
    card.appendChild(el(`
      <div>
        <h1 class="auth-h">Set a new password</h1>
        <p class="auth-lede">Choose a new password for your account.</p>
        <form id="f" novalidate>
          <label class="auth-field"><span>New password <span class="idx">01</span></span><input class="auth-cell" type="password" id="pw" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label>
          <button type="submit" class="auth-submit" id="btn"><span id="lbl">Update password</span><span class="arw">&rarr;</span></button>
          <div class="auth-msg" id="msg" role="status" aria-live="polite"></div>
        </form>
      </div>`));
    const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn'), lbl = document.getElementById('lbl');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      if (pw.length < 8) { msg.className = 'auth-msg err'; msg.textContent = '// use at least 8 characters.'; return; }
      btn.disabled = true; lbl.textContent = 'Updating…';
      const r = await updatePassword(recoveryToken, pw);
      if (r.ok) { msg.className = 'auth-msg ok'; msg.textContent = '// password updated. redirecting to log in…'; setTimeout(() => location.replace('login.html'), 1400); return; }
      btn.disabled = false; lbl.textContent = 'Update password';
      msg.className = 'auth-msg err'; msg.textContent = '// ' + (r.data.msg || 'that reset link has expired. request a new one.');
    });
  } else {
    card.appendChild(el(`
      <div>
        <h1 class="auth-h">Reset password</h1>
        <p class="auth-lede">Enter your email and we’ll send a secure reset link.</p>
        <form id="f" novalidate>
          <label class="auth-field"><span>Email <span class="idx">01</span></span><input class="auth-cell" type="email" id="email" autocomplete="email" placeholder="you@company.com" required></label>
          <button type="submit" class="auth-submit" id="btn"><span id="lbl">Send reset link</span><span class="arw">&rarr;</span></button>
          <div class="auth-msg" id="msg" role="status" aria-live="polite"></div>
        </form>
        <div class="auth-foot"><a href="login.html">Back to <span class="mk">log in</span></a></div>
      </div>`));
    const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn'), lbl = document.getElementById('lbl');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; lbl.textContent = 'Sending…';
      await sendAuthEmail(document.getElementById('email').value.trim(), 'recovery');
      msg.className = 'auth-msg ok';
      msg.textContent = '// if that email has an account, a reset link is on its way.';
      lbl.textContent = 'Sent';
    });
  }
</script>
<script defer src="/assets/ga.js?v=1"></script>
</body>
</html>
